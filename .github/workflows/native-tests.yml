name: Native C++ tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Run tokenizer tests
        run: sh tests/run_tokenizer_tests.sh
      - name: Run Transformer tests
        run: sh tests/run_transformer_tests.sh
      - name: Validate knowledge dataset
        run: python3 scripts/validate_knowledge_dataset.py
      - name: Test deterministic dataset preparation
        run: PYTHONPATH=scripts python3 -m unittest discover -s tests -p 'test_prepare_dataset.py'
      - name: Prepare actual curriculum train and validation splits
        run: python3 scripts/prepare_dataset.py --seed 2026
