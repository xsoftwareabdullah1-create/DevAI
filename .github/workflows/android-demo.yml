name: Android demo APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'scripts/**'
      - '.github/workflows/android-demo.yml'
  pull_request:
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Dev Orus 1.1 Gemma APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print

      - name: Install required Android SDK components
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Prepare verified LiteRT-LM Android runtime
        run: bash scripts/prepare_litertlm_android.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Redmi 9 Power compatible APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK, ABI, and native dependency names
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package:|sdkVersion:|targetSdkVersion:"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "native-code: 'arm64-v8a'"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/lib(devai|LiteRtLm)\\.so'
          READ_ELF="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          mkdir -p build-apk-check
          unzip -p "$APK" lib/arm64-v8a/libdevai.so > build-apk-check/libdevai.so
          "$READ_ELF" -d build-apk-check/libdevai.so | tee build-apk-check/dynamic.txt
          grep -F 'Shared library: [libLiteRtLm.so]' build-apk-check/dynamic.txt
          if grep -E 'Shared library: \\[/|Shared library: \\[.*[A-Za-z]:\\\\' build-apk-check/dynamic.txt; then
            echo "ERROR: libdevai.so contains an absolute native dependency path."
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload installable demo APK
        uses: actions/upload-artifact@v4
        with:
          name: DevAI-Redmi9Power-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
